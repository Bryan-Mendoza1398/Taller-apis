<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecera">
    <h1 class="logo">Pokédex</h1>

    <div class="buscador">
      <input type="text" class="barra-busqueda" placeholder="Busca por nombre o número (ej: pikachu, 25)">
      <button class="boton-buscar">
        <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" alt="buscar">
      </button>
    </div>

    <div class="filtros" id="contenedorFiltros"></div>
  </header>

  <p class="cargando" id="mensajeCarga">Cargando Pokémon...</p>

  <main class="cuadricula" id="cuadriculaPokemon"></main>

  <script src="script.js"></script>
</body>
</html>
